/* ---------------------------- PHOTO SCREENSAVER ---------------------------- */
let lastActivity = Date.now();
let screensaverActive = false;
let screensaverTimer = null;
let screensaverPhotoIndex = 0;

function markActivity(){
  lastActivity = Date.now();
  if(screensaverActive) hideScreensaver();
}
["click","touchstart","mousemove","keydown","scroll"].forEach(evt=>{
  document.addEventListener(evt, markActivity, {passive:true});
});

// Let Enter submit any "type something, tap Add/Save" row (list items,
// chores, family members, rewards, calendar feeds, city, etc.) instead of
// forcing a tap on the button. Scoped to plain text/url/search inputs so it
// never hijacks Enter inside a multi-line textarea (like routine steps).
document.addEventListener("keydown", (e)=>{
  if(e.key !== "Enter") return;
  const target = e.target;
  if(!target || target.tagName !== "INPUT") return;
  if(target.type && !["text","url","search","tel",""].includes(target.type)) return;
  const addLine = target.closest(".addLine");
  if(!addLine) return;
  const btn = addLine.querySelector("button");
  if(btn){ e.preventDefault(); btn.click(); }
});

function checkIdleForScreensaver(){
  const s=state.settings;
  if(!s.screensaverEnabled || !state.photos.length || screensaverActive) return;
  const idleMinutes = (Date.now()-lastActivity)/60000;
  if(idleMinutes >= Math.max(1, s.screensaverIdleMinutes||5)) showScreensaver();
}
function showScreensaver(){
  if(screensaverActive || !state.photos.length) return;
  screensaverActive = true;
  screensaverPhotoIndex = 0;
  const overlay=document.createElement("div");
  overlay.className="screensaverOverlay";
  overlay.id="screensaverOverlay";
  overlay.innerHTML = `<img class="ssImg" id="ssImg" src="${state.photos[0].data}">
    <div class="screensaverInfo">
      <div class="ssTime" id="ssTime">--:--</div>
      <div class="ssDate" id="ssDate"></div>
      <div class="ssWeather" id="ssWeather"></div>
      <div class="ssHint">Tap anywhere to go back</div>
    </div>`;
  document.body.appendChild(overlay);
  updateScreensaverClock();
  screensaverTimer = setInterval(()=>{
    screensaverPhotoIndex = (screensaverPhotoIndex+1) % state.photos.length;
    const img=document.getElementById("ssImg");
    if(img) img.src = state.photos[screensaverPhotoIndex].data;
    updateScreensaverClock();
  }, 8000);
}
function updateScreensaverClock(){
  const t=document.getElementById("ssTime"), d=document.getElementById("ssDate"), w=document.getElementById("ssWeather");
  if(!t) return;
  const now=new Date();
  let h=now.getHours(); const ampm=h>=12?"PM":"AM"; h=h%12; if(h===0)h=12;
  t.textContent = h+":"+pad(now.getMinutes())+" "+ampm;
  d.textContent = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][now.getDay()]+", "+MONTHS[now.getMonth()]+" "+now.getDate();
  if(weatherCache){
    w.textContent = `${weatherEmoji(weatherCache.current.weather_code)} ${Math.round(weatherCache.current.temperature_2m)}° · ${weatherText(weatherCache.current.weather_code)}`;
  }
}
function hideScreensaver(){
  screensaverActive = false;
  if(screensaverTimer){ clearInterval(screensaverTimer); screensaverTimer=null; }
  const overlay=document.getElementById("screensaverOverlay");
  if(overlay) overlay.remove();
}

/* ---------------------------- BOOT ---------------------------- */
function boot(){
  renderTab();
  tickClock(); setInterval(tickClock, 15000);
  if(state.settings.lat!=null){ refreshWeather(); setInterval(refreshWeather, 60*60*1000); }
  if(state.feeds.length){ syncAllFeeds(false); }
  setInterval(()=> syncAllFeeds(false), Math.max(5,state.settings.syncMinutes||20)*60*1000);
  setInterval(checkIdleForScreensaver, 15000);
}

/* =========================================================================
   AUTH / HOUSEHOLD SYNC
   Gates the whole app behind Google Sign-In. Once signed in, a user either
   creates a new household (which mints a short invite code) or joins an
   existing one by entering that code. Everyone in the same household
   shares one Firestore document that's kept live via onSnapshot, so any
   change on one device shows up on every other signed-in device within a
   second or two. If Firebase itself fails to load/initialize (offline,
   ad-blocker, etc.) the app still boots normally using localStorage only.
   ========================================================================= */
function showAuthGate(bodyHtml){
  const gate=document.getElementById("authGate");
  if(gate) gate.style.display="flex";
  const body=document.getElementById("authGateBody");
  if(body) body.innerHTML=bodyHtml;
}
function hideAuthGate(){
  const gate=document.getElementById("authGate");
  if(gate) gate.style.display="none";
}
function setAuthError(msg){
  const el=document.getElementById("authGateError");
  if(el) el.textContent = msg||"";
}
function fb(){ return window.__firebase; }

function renderSignInScreen(){
  setAuthError("");
  showAuthGate(`<button class="addBtn" id="googleSignInBtn" style="width:100%;margin-top:10px;">Sign in with Google</button>`);
  const btn=document.getElementById("googleSignInBtn");
  if(btn) btn.onclick = async ()=>{
    setAuthError("");
    const { auth, GoogleAuthProvider, signInWithPopup } = fb();
    try{ await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch(e){ setAuthError("Sign-in failed: " + (e&&e.message?e.message:e)); }
  };
}
function renderLoadingScreen(msg){
  setAuthError("");
  showAuthGate(`<p class="helpText">${escapeHtml(msg||"Loading your family's calendar…")}</p>`);
}
function renderHouseholdChoiceScreen(){
  setAuthError("");
  showAuthGate(`
    <p class="helpText">Create a new household calendar, or join one someone in your family already started.</p>
    <button class="addBtn" id="createHouseholdBtn" style="width:100%;margin-top:6px;">Create a new household</button>
    <p class="helpText" style="margin-top:16px;margin-bottom:6px;">— or, if someone already gave you an invite code —</p>
    <div class="field row">
      <input type="text" id="joinCodeInput" placeholder="Invite code" style="text-transform:uppercase;">
      <button class="miniBtn" id="joinHouseholdBtn">Join</button>
    </div>
    <button class="miniBtn danger" id="gateSignOutBtn" style="margin-top:16px;">Sign out</button>
  `);
  const createBtn=document.getElementById("createHouseholdBtn");
  if(createBtn) createBtn.onclick = createHousehold;
  const joinBtn=document.getElementById("joinHouseholdBtn");
  const joinInput=document.getElementById("joinCodeInput");
  if(joinBtn) joinBtn.onclick = ()=>{
    const code=(joinInput.value||"").trim().toUpperCase();
    if(code) joinHousehold(code); else setAuthError("Enter the invite code first.");
  };
  if(joinInput) joinInput.addEventListener("keydown",(e)=>{
    if(e.key==="Enter"){ e.preventDefault(); joinBtn.click(); }
  });
  const soBtn=document.getElementById("gateSignOutBtn");
  if(soBtn) soBtn.onclick = ()=> fb().signOut(fb().auth);
}

function makeHouseholdCode(){
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // skips 0/O/1/I to avoid mix-ups when read aloud
  let out=""; for(let i=0;i<6;i++) out+=chars[Math.floor(Math.random()*chars.length)];
  return out;
}

async function createHousehold(){
  renderLoadingScreen("Creating your household…");
  const { db, doc, getDoc, setDoc, serverTimestamp } = fb();
  try{
    let code=makeHouseholdCode(), attempts=0;
    while(attempts<5){
      const snap=await getDoc(doc(db,"households",code,"meta","info"));
      if(!snap.exists()) break;
      code=makeHouseholdCode(); attempts++;
    }
    await setDoc(doc(db,"households",code,"meta","info"), {
      members:[currentUser.uid], createdAt:serverTimestamp(), createdBy:currentUser.uid
    });
    await setDoc(doc(db,"households",code,"data","state"), state);
    await setDoc(doc(db,"users",currentUser.uid), { householdCode:code, email:currentUser.email||null }, { merge:true });
    householdCode=code;
    attachHouseholdListener();
  }catch(e){
    renderHouseholdChoiceScreen();
    setAuthError("Couldn't create a household: " + (e&&e.message?e.message:e));
  }
}

async function joinHousehold(code){
  renderLoadingScreen("Joining household " + code + "…");
  const { db, doc, getDoc, updateDoc, arrayUnion, setDoc } = fb();
  try{
    const metaRef=doc(db,"households",code,"meta","info");
    const snap=await getDoc(metaRef);
    if(!snap.exists()){
      renderHouseholdChoiceScreen();
      setAuthError("No household found with code " + code + " — double-check it with whoever set it up.");
      return;
    }
    await updateDoc(metaRef, { members: arrayUnion(currentUser.uid) });
    await setDoc(doc(db,"users",currentUser.uid), { householdCode:code, email:currentUser.email||null }, { merge:true });
    householdCode=code;
    attachHouseholdListener();
  }catch(e){
    renderHouseholdChoiceScreen();
    setAuthError("Couldn't join that household: " + (e&&e.message?e.message:e));
  }
}

function attachHouseholdListener(){
  renderLoadingScreen("Loading your family's calendar…");
  const { db, doc, onSnapshot } = fb();
  if(householdUnsub){ householdUnsub(); householdUnsub=null; }
  householdUnsub = onSnapshot(doc(db,"households",householdCode,"data","state"), (snap)=>{
    if(!snap.exists()){
      if(!householdDataLoaded){ householdDataLoaded=true; startApp(); } // household doc has no state yet — boot with local state
      return;
    }
    const remote=snap.data();
    const merged=Object.assign(defaultState(), remote);
    merged.settings=Object.assign(defaultState().settings, remote.settings||{});
    // Photos are deliberately device-local (never written to Firestore),
    // so keep whatever this device already has instead of wiping them out.
    merged.photos = state.photos;
    migrateChoreDates(merged);

    if(!householdDataLoaded){
      householdDataLoaded=true;

      // Safety net: if this device already has real, possibly-unsynced
      // data that's different from what's in the household, DON'T
      // silently overwrite it — that's exactly how data got lost before.
      // Stop and let the person choose instead.
      if(localStateHasRealData(state) && JSON.stringify(merged) !== JSON.stringify(state)){
        pendingRemoteState = merged;
        renderSyncConflictScreen();
        return;
      }

      applyingRemoteUpdate=true;
      state=merged;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      applyingRemoteUpdate=false;
      startApp(); // decides: boot straight in, or show the family-setup screen first
      return;
    }

    // Firestore echoes every write back through this same listener —
    // including the ones THIS device just made. Skip anything that's not
    // an actual change so a normal edit doesn't trigger a needless re-render.
    if(JSON.stringify(merged) === JSON.stringify(state)) return;

    applyingRemoteUpdate=true;
    state=merged;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    applyingRemoteUpdate=false;

    if(!appBooted){
      // Still on a blocking screen (e.g. the family-setup step) — don't
      // silently boot the app out from under them. Their own Continue
      // click (or a fresh startApp() call) is what advances past it.
      return;
    }

    // Never yank a field out from under someone mid-edit (e.g. typing into
    // a meal box, a chore name, a list item). If something's focused, keep
    // the fresher data in memory/localStorage quietly and pick up the
    // visual refresh as soon as they click away instead of right now.
    const active=document.activeElement;
    const main=document.getElementById("main");
    const isEditing = active && ["INPUT","TEXTAREA","SELECT"].includes(active.tagName) && main && main.contains(active);
    if(isEditing){
      active.addEventListener("blur", ()=>{ renderTab(); }, { once:true });
    }else{
      renderTab();
    }
  }, (err)=>{
    console.warn("Household sync error:", err);
    if(!householdDataLoaded){ householdDataLoaded=true; startApp(); } // don't strand the user on a spinner forever
  });
}

function startApp(){
  // Every household needs at least one family member before the app
  // itself is useful — walk them through adding one instead of dropping
  // them into an empty dashboard.
  if(!state.profiles.length){
    renderFamilySetupScreen();
    return;
  }
  appBooted=true;
  hideAuthGate();
  boot();

// Register the service worker so the app shell installs to the home screen
// and still opens (though live calendar/weather sync needs wifi/data).
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("service-worker.js").catch(()=>{});
  });
}
}

function renderSyncConflictScreen(){
  setAuthError("");
  showAuthGate(`
    <h3 style="margin:-4px 0 10px">⚠️ This device has unsynced data</h3>
    <p class="helpText">This device already has information saved (family members, chores, lists, etc.) that's different from what's currently in this household's shared calendar — most likely because it was added before this device connected to the household. To make sure nothing gets lost, choose how to proceed:</p>
    <button class="miniBtn" id="syncConflictExportBtn" style="width:100%;margin:10px 0;">⬇ Export this device's data first (recommended)</button>
    <button class="addBtn" id="syncConflictUseCloudBtn" style="width:100%;margin-bottom:4px;">Use the household's shared data</button>
    <p class="helpText" style="margin:2px 0 14px;">This device's local-only data will be replaced with what everyone else already sees. Export first above if you're not sure.</p>
    <button class="miniBtn" id="syncConflictKeepLocalBtn" style="width:100%;">Keep this device's data instead</button>
    <p class="helpText" style="margin-top:6px;">Pushes what's on this device up to the household, replacing what's currently shared there. Only choose this if this device's data is the one that should win.</p>
  `);
  const exportBtn=document.getElementById("syncConflictExportBtn");
  if(exportBtn) exportBtn.onclick=()=> downloadBackupFile(state, "this-device-backup-"+isoDate(new Date())+".json");
  const useCloudBtn=document.getElementById("syncConflictUseCloudBtn");
  if(useCloudBtn) useCloudBtn.onclick=()=>{
    applyingRemoteUpdate=true;
    state = pendingRemoteState;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    applyingRemoteUpdate=false;
    pendingRemoteState=null;
    startApp();
  };
  const keepLocalBtn=document.getElementById("syncConflictKeepLocalBtn");
  if(keepLocalBtn) keepLocalBtn.onclick=()=>{
    pendingRemoteState=null;
    // Push this device's current state up right away, rather than waiting
    // for the next edit to trigger a debounced save.
    pushStateToCloud();
    startApp();
  };
}

function renderFamilySetupScreen(){
  setAuthError("");
  showAuthGate(`
    <p class="helpText">Add everyone in your household — each person gets their own schedule, chores, and star tally. You can add, rename, or remove people anytime later in Settings.</p>
    <div id="familySetupList" style="margin:10px 0;">
      ${state.profiles.map(p=>`
        <div class="settRow">
          <div class="colorDot" style="background:${p.color}"></div>
          <div style="flex:1;text-align:left">${escapeHtml(p.name)}</div>
          <button class="miniBtn danger" data-removesetupprofile="${p.id}">Remove</button>
        </div>`).join("") || `<p class="helpText">No one added yet.</p>`}
    </div>
    <div class="addLine">
      <input type="text" id="familySetupName" placeholder="Family member's name">
      <button id="familySetupAddBtn">Add</button>
    </div>
    <button class="addBtn" id="familySetupContinueBtn" style="width:100%;margin-top:14px;" ${state.profiles.length?'':'disabled'}>Continue to My Family →</button>
  `);
  const nameInput=document.getElementById("familySetupName");
  const addBtn=document.getElementById("familySetupAddBtn");
  if(addBtn) addBtn.onclick=()=>{
    const name=(nameInput.value||"").trim();
    if(!name) return;
    const color=DEFAULT_COLORS[state.profiles.length % DEFAULT_COLORS.length];
    state.profiles.push({id:"p_"+Date.now(), name, color});
    saveState();
    renderFamilySetupScreen(); // refresh the list and enable Continue
  };
  document.querySelectorAll("[data-removesetupprofile]").forEach(btn=>{
    btn.onclick=()=>{
      state.profiles = state.profiles.filter(p=>p.id!==btn.dataset.removesetupprofile);
      saveState();
      renderFamilySetupScreen();
    };
  });
  const continueBtn=document.getElementById("familySetupContinueBtn");
  if(continueBtn) continueBtn.onclick=()=>{
    if(!state.profiles.length) return;
    startApp();
  };
}

// The Firebase module script (above) dispatches this once it has either
// set up window.__firebase or given up and set window.__firebaseInitError.
// This classic script runs synchronously during parsing, before that
// module script has had a chance to run, so we can't check its result yet
// — we just wait for the event instead of calling boot() directly.
(function(){
  window.addEventListener("firebaseReady", ()=>{
    if(!window.__firebase){
      // Firebase couldn't initialize (offline, blocked script, bad config).
      // Fall back to the old local-only behavior rather than locking
      // Travis's family out of their calendar.
      console.warn("Firebase unavailable — continuing in local-only mode.");
      startApp();
      return;
    }
    const { auth, onAuthStateChanged, getDoc, doc, db } = fb();
    onAuthStateChanged(auth, async (user)=>{
      if(!user){
        currentUser=null; householdCode=null;
        if(householdUnsub){ householdUnsub(); householdUnsub=null; }
        appBooted=false; householdDataLoaded=false;
        renderSignInScreen();
        return;
      }
      currentUser=user;
      renderLoadingScreen("Just a moment…");
      try{
        const userSnap=await getDoc(doc(db,"users",user.uid));
        if(userSnap.exists() && userSnap.data().householdCode){
          householdCode=userSnap.data().householdCode;
          attachHouseholdListener();
        }else{
          renderHouseholdChoiceScreen();
        }
      }catch(e){
        setAuthError("Couldn't check your account: " + (e&&e.message?e.message:e));
        renderHouseholdChoiceScreen();
      }
    });
  });
})();
</script>
