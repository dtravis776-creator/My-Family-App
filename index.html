<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>My Family</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d3b3e">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Family">
<style>
  :root{
    --bg:#e9f6ef; --card:#ffffff; --ink:#1f2d2c; --muted:#6c8985; --line:#dcece3;
    --accent:#12726e; --accent-dark:#0d3b3e; --good:#3fae6a; --warn:#e2a33d;
    --header:#0d3b3e; --headerInk:#ffffff;
    --serif:Georgia,'Times New Roman',serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-user-select:none;user-select:none;overflow:hidden;}
  #app{display:flex;flex-direction:column;height:100vh;width:100vw;}
  @supports (height: 100dvh){ #app{height:100dvh;} }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;
    -webkit-tap-highlight-color:transparent;touch-action:manipulation;}
  input,select,textarea{font-family:inherit;font-size:16px;}
  h1,h2,h3{font-family:var(--serif);}

  /* ---------- HEADER ---------- */
  header{display:flex;align-items:center;justify-content:space-between;
    padding:16px max(24px, env(safe-area-inset-right)) 16px max(24px, env(safe-area-inset-left));
    background:var(--header);color:var(--headerInk);flex-shrink:0;}
  #clockBlock{min-width:220px;max-width:360px;}
  #appName{font-size:15px;font-weight:700;color:#ffd9a8;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #clockTime{font-size:34px;font-weight:700;line-height:1;font-family:var(--serif);}
  #clockDate{font-size:15px;color:#bcd8d4;margin-top:4px;}
  #weatherBlock{display:flex;align-items:center;gap:14px;font-size:15px;}
  #weatherBlock .wIcon{font-size:34px;}
  #weatherBlock .wNow{display:flex;flex-direction:column;line-height:1.15;}
  #weatherBlock .wTemp{font-size:26px;font-weight:700;font-family:var(--serif);}
  #weatherBlock .wDesc{font-size:12px;color:#bcd8d4;}
  #weatherBlock .wDays{display:flex;gap:10px;color:#bcd8d4;padding-left:12px;border-left:1px solid rgba(255,255,255,.25);}
  #countdownChip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;padding:8px 16px;
    border-radius:14px;font-size:14px;font-weight:600;max-width:260px;text-align:right;}

  /* ---------- NAV ---------- */
  /* The nav is a floating popover now (opened via the round FAB button,
     bottom-right) instead of a bar permanently taking up screen space.
     Base rules below are harmless leftovers from the old bar layout; the
     #mainNav-specific rules further down (higher specificity: id beats
     element) are what actually apply. Kept both instead of deleting the
     base rules so nothing else that happens to say "nav button" breaks. */
  nav{display:flex;background:var(--card);border-bottom:1px solid var(--line);flex-shrink:0;}
  nav button{flex:1;padding:14px 0;font-size:16px;font-weight:600;color:var(--muted);
    border-bottom:3px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px;}
  nav button.active{color:var(--accent);border-bottom-color:var(--accent);}
  nav .navIcon{font-size:18px;line-height:1;}
  nav .navLabel{font-size:12px;line-height:1;}

  nav#mainNav{
    position:fixed; display:none; flex-direction:column;
    right:max(20px, env(safe-area-inset-right));
    bottom:calc(84px + env(safe-area-inset-bottom));
    background:var(--card); border:1px solid var(--line); border-bottom:1px solid var(--line);
    border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,.25);
    padding:6px; gap:2px; min-width:190px; z-index:160;
  }
  nav#mainNav.open{display:flex;}
  nav#mainNav button{flex:none; flex-direction:row; justify-content:flex-start; align-items:center;
    gap:10px; padding:11px 14px; min-height:44px; border-bottom:none; border-radius:10px; width:100%;}
  nav#mainNav button.active{background:var(--accent); color:#fff;}
  nav#mainNav .navIcon{font-size:18px;}
  nav#mainNav .navLabel{font-size:14px;}

  #navBackdrop{position:fixed; inset:0; background:transparent; z-index:150; display:none;}
  #navBackdrop.open{display:block;}

  #navFab{
    position:fixed; z-index:170;
    right:max(20px, env(safe-area-inset-right));
    bottom:max(20px, env(safe-area-inset-bottom));
    width:56px; height:56px; border-radius:50%;
    background:var(--accent); color:#fff; font-size:24px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 18px rgba(0,0,0,.3);
    transition:transform .15s ease;
  }
  #navFab.open{transform:rotate(45deg);}
  .iconBadge{width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
    font-size:18px;flex-shrink:0;}
  .newTag{background:var(--accent);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;
    text-transform:uppercase;letter-spacing:.5px;}

  main{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;
    padding:16px max(22px, env(safe-area-inset-right)) max(96px, calc(80px + env(safe-area-inset-bottom))) max(22px, env(safe-area-inset-left));}

  /* ---------- CALENDAR TOOLBAR ---------- */
  .cal-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:10px;}
  .cal-toolbar .navBtns{display:flex;align-items:center;gap:10px;}
  .cal-toolbar .navBtns button{font-size:20px;background:var(--card);border:1px solid var(--line);
    border-radius:10px;padding:6px 14px;}
  .cal-toolbar h2{margin:0 10px;font-size:20px;min-width:190px;text-align:center;}
  .viewSwitch{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .viewSwitch button{padding:8px 16px;font-size:14px;font-weight:600;color:var(--muted);}
  .viewSwitch button.active{background:var(--accent);color:#fff;}
  .profileChips{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;border:2px solid transparent;opacity:.45;}
  .chip.on{opacity:1;}
  .addBtn{background:var(--accent);color:#fff;padding:10px 18px;border-radius:10px;font-weight:700;font-size:15px;}

  /* ---------- MONTH GRID ---------- */
  .monthGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .dowRow{font-size:12px;color:var(--muted);text-align:center;padding-bottom:4px;font-weight:700;}
  .dayCell{background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:100px;
    padding:6px;display:flex;flex-direction:column;gap:3px;position:relative;}
  .dayCell.other{opacity:.35;}
  .dayCell.today{border:2px solid var(--accent);}
  .dayNum{font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center;}
  .dayWeather{font-size:11px;color:var(--muted);}
  .evChip{font-size:11px;padding:2px 6px;border-radius:6px;color:#fff;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;}
  .moreChip{font-size:11px;color:var(--muted);font-weight:600;}

  /* ---------- WEEK / DAY AGENDA ---------- */
  .weekCols{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:start;}
  .weekCol{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:200px;}
  .weekCol h4{margin:0 0 6px;font-size:13px;text-align:center;color:var(--muted);}
  .weekCol h4 span{display:block;font-size:16px;color:var(--ink);font-weight:700;}
  .agendaEv{font-size:12px;padding:5px 7px;border-radius:7px;color:#fff;margin-bottom:5px;}
  .agendaEv b{display:block;font-size:11px;opacity:.9;}
  .dayAgenda .agendaEv{font-size:14px;padding:10px 12px;margin-bottom:8px;}

  /* ---------- CARDS / LISTS ---------- */
  .col2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;
    box-shadow:0 2px 14px rgba(13,59,62,.06);}
  .card h3{margin:0 0 12px;font-size:18px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .card h3 .titleGroup{display:flex;align-items:center;gap:10px;}
  .starTally{font-size:13px;color:var(--warn);font-weight:700;}
  .choreRow,.itemRow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
  .choreRow:last-child,.itemRow:last-child{border-bottom:none;}
  .checkBox{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:15px;}
  .checkBox.done{background:var(--good);border-color:var(--good);color:#fff;}
  .rowText{flex:1;font-size:15px;}
  .rowText.done{text-decoration:line-through;color:var(--muted);}
  /* Inline-editable text: looks like a plain label until tapped, so editing
     a list name or item never requires deleting and re-adding it. */
  input.editableText{border:1px solid transparent;background:transparent;color:inherit;
    padding:4px 6px;border-radius:6px;width:100%;font-family:inherit;}
  input.editableText:hover{background:#f3f9f5;}
  input.editableText:focus{outline:none;border-color:var(--accent);background:#fff;}
  input.editableTitle{flex:1;font-size:18px;font-weight:700;font-family:var(--serif);min-width:0;}
  .smallBtn{font-size:13px;color:var(--muted);padding:4px 8px;}
  .recurToggle{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);white-space:nowrap;flex-shrink:0;cursor:pointer;}
  .recurToggle input{margin:0;}
  .choreReschedule{width:100%;display:flex;align-items:center;gap:8px;margin-top:2px;padding-left:36px;flex-wrap:wrap;}
  .choreReschedule .miniBtn{padding:5px 10px;font-size:12px;}
  .choreReschedule input[type="date"]{max-width:150px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;font-size:12px;}

  /* ---------- HOME: tappable sections that jump to the relevant tab ---------- */
  .homeLink{cursor:pointer;border-radius:10px;margin:0 -8px;padding:2px 8px;transition:background .12s;}
  .homeLink:hover{background:#f3f9f5;}
  .homeLink:active{background:#e3f2ef;}
  .homeLink.itemRow,.homeLink.choreRow{margin:0 -8px;padding-left:8px;padding-right:8px;}
  .homeLinkArrow{color:var(--muted);font-size:12px;margin-left:4px;}
  .addLine{display:flex;gap:8px;margin-top:10px;}
  .addLine input{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;}
  .addLine button{background:var(--accent);color:#fff;padding:8px 14px;border-radius:8px;font-weight:700;}

  /* ---------- MEALS ---------- */
  .mealGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
  .mealCol{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;}
  .mealCol h4{margin:0 0 8px;font-size:13px;text-align:center;color:var(--muted);}
  .mealSlot{font-size:11px;color:var(--muted);margin-top:6px;}
  .mealSlot textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:4px 6px;
    font-size:12px;resize:none;height:40px;margin-top:2px;}

  /* ---------- SETTINGS ---------- */
  .settRow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
  .settRow:last-child{border-bottom:none;}
  .colorDot{width:20px;height:20px;border-radius:50%;flex-shrink:0;}
  .settRow input[type=text],.settRow input[type=url]{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;}
  .miniBtn{background:#f2ede4;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;}
  .miniBtn.danger{background:#fde3e0;color:#c0392b;}
  .helpText{font-size:12px;color:var(--muted);line-height:1.5;margin-top:6px;}

  /* ---------- MODAL ---------- */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;
    z-index:50;}
  .modal{background:#fff;border-radius:16px;padding:22px;width:92%;max-width:460px;max-height:88vh;overflow:auto;}
  .modal h3{margin-top:0;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:600;}
  .field input,.field select,.field textarea{width:100%;padding:9px 10px;border:1px solid var(--line);
    border-radius:8px;}
  .field .row{display:flex;gap:10px;}
  .modalBtns{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;}
  .modalBtns button{padding:10px 18px;border-radius:9px;font-weight:700;font-size:14px;}
  .btnCancel{background:#f2ede4;}
  .btnSave{background:var(--accent);color:#fff;}
  .btnDelete{background:#fde3e0;color:#c0392b;margin-right:auto;}
  .swatches{display:flex;gap:8px;flex-wrap:wrap;}
  .swatch{width:28px;height:28px;border-radius:50%;border:3px solid transparent;}
  .swatch.sel{border-color:#000;}
  .hidden{display:none!important;}

  /* ---------- CHORE COUNTERS / WEEKLY STRIP ---------- */
  .todayCounter{font-size:13px;color:var(--accent);font-weight:700;background:#e3f2ef;padding:3px 12px;border-radius:20px;white-space:nowrap;}
  .dayStrip{display:flex;gap:6px;margin:12px 0 6px;}
  .dayStripItem{flex:1;text-align:center;background:#f3f9f5;border-radius:10px;padding:6px 2px;font-size:10px;color:var(--muted);font-weight:600;cursor:pointer;user-select:none;}
  .dayStripItem.today{background:var(--accent);color:#fff;}
  .dayStripItem.selected{outline:2px solid var(--accent);outline-offset:1px;}
  .dayStripItem .dsCount{display:block;font-weight:700;font-size:13px;margin-top:2px;}
  .addLine input[type="date"]{flex:0 0 auto;max-width:150px;}

  /* ---------- ROUTINES ---------- */
  .routinesSection{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);}
  .routinesSection h4{margin:0 0 8px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .routineCard{margin-bottom:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fbfdfc;}
  .routineCard .routineHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .routineCard .routineHead b{font-size:14px;}
  .routineProgress{font-size:11px;color:var(--muted);font-weight:600;}
  .routineStep{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:13px;}
  .routineStep .checkBox{width:20px;height:20px;font-size:11px;}
  .routineDone{color:var(--good);font-weight:700;font-size:12px;margin-top:4px;}

  /* ---------- REWARDS ---------- */
  .rewardsSection{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);}
  .rewardsSection h4{margin:0 0 8px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;
    display:flex;justify-content:space-between;align-items:center;}
  .balancePill{background:#fff4de;color:#b9790a;padding:3px 12px;border-radius:20px;font-weight:700;font-size:13px;}
  .rewardRow{display:flex;align-items:center;gap:10px;padding:6px 0;}
  .rewardRow .rewardName{flex:1;font-size:14px;}
  .rewardCost{font-size:12px;color:var(--warn);font-weight:700;white-space:nowrap;}
  .redeemBtn{background:var(--accent);color:#fff;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;}
  .redeemBtn:disabled{opacity:.35;cursor:not-allowed;}
  .redeemLog{font-size:11px;color:var(--muted);margin-top:6px;}

  /* ---------- PHOTO SCREENSAVER ---------- */
  .photoThumbs{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;}
  .photoThumb{position:relative;width:70px;height:70px;border-radius:10px;overflow:hidden;flex-shrink:0;}
  .photoThumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .photoThumb button{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.55);color:#fff;border-radius:50%;
    width:20px;height:20px;font-size:12px;line-height:1;}
  .screensaverOverlay{position:fixed;inset:0;background:#000;z-index:200;overflow:hidden;}
  .screensaverOverlay .ssImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .screensaverInfo{position:absolute;left:0;right:0;bottom:0;color:#fff;text-align:center;padding:34px 20px;
    background:linear-gradient(transparent,rgba(0,0,0,.7));}
  .screensaverInfo .ssTime{font-size:52px;font-weight:700;font-family:var(--serif);}
  .screensaverInfo .ssDate{font-size:16px;opacity:.85;margin-top:4px;}
  .screensaverInfo .ssWeather{font-size:15px;opacity:.9;margin-top:8px;}
  .screensaverInfo .ssHint{font-size:12px;opacity:.6;margin-top:14px;}

  /* ---------- MOBILE / NARROW SCREENS ---------- */
  @media (max-width: 700px){
    html,body{overflow-y:auto;-webkit-user-select:auto;user-select:auto;}
    #app{height:auto;min-height:100vh;}
    header{flex-wrap:wrap;padding:10px 12px;gap:8px;}
    #clockBlock{min-width:0;max-width:none;flex:1 1 100%;order:1;}
    #appName{font-size:13px;white-space:normal;}
    #clockTime{font-size:26px;}
    #clockDate{font-size:13px;}
    #weatherBlock{order:2;font-size:12px;gap:8px;flex-wrap:wrap;}
    #weatherBlock .wIcon{font-size:22px;}
    #weatherBlock .wTemp{font-size:17px;}
    #weatherBlock .wDesc{font-size:10px;}
    #weatherBlock .wDays{gap:6px;font-size:10px;padding-left:8px;}
    .screensaverInfo .ssTime{font-size:34px;}
    .screensaverInfo .ssDate{font-size:13px;}
    .screensaverInfo .ssWeather{font-size:12px;}
    #countdownChip{order:3;flex:1 1 100%;max-width:none;text-align:left;font-size:12px;padding:6px 12px;}

    nav button{padding:9px 0;}
    nav .navIcon{font-size:17px;}
    nav .navLabel{font-size:10px;}

    main{padding:10px max(12px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));}
    .cal-toolbar{gap:8px;}
    .cal-toolbar .navBtns{gap:6px;}
    .cal-toolbar h2{font-size:15px;min-width:0;margin:0 4px;}
    .cal-toolbar .navBtns button{font-size:16px;padding:5px 10px;}
    .viewSwitch button{padding:6px 10px;font-size:12px;}
    .addBtn{padding:8px 12px;font-size:13px;}
    .profileChips{gap:5px;}
    .chip{padding:5px 10px;font-size:11px;}

    /* Month grid: shrink cells rather than force 7 tiny unreadable columns */
    .monthGrid{gap:3px;}
    .dowRow{font-size:9px;}
    .dayCell{min-height:56px;padding:3px;border-radius:6px;gap:1px;}
    .dayNum{font-size:10px;}
    .dayWeather{font-size:9px;}
    .evChip{font-size:8px;padding:1px 3px;border-radius:4px;}
    .moreChip{font-size:8px;}

    /* Week view and meal planner: let the 7 days scroll horizontally
       instead of squeezing into unreadable slivers. */
    .weekCols{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;gap:8px;padding-bottom:6px;}
    .weekCol{flex:0 0 42vw;min-width:150px;}
    .mealGrid{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;gap:8px;padding-bottom:6px;}
    .mealCol{flex:0 0 60vw;min-width:190px;}

    .col2{grid-template-columns:1fr;}
    .card{padding:12px;}

    .modal{padding:16px;width:94%;}
    .field .row{flex-direction:column;gap:4px;}
  }

  /* ---------- PHONE (narrower than a tablet) ----------
     Everything above already handles "narrow-ish" (tablet/kiosk) widths.
     This block targets actual phones: bigger tap targets (44px is the
     usual minimum comfortable touch size), no sideways scrolling except
     where it's intentional (week view, meal planner), and a bit more
     breathing room so it reads as an app rather than a shrunk-down site. */
  @media (max-width: 480px){
    html,body{overflow-x:hidden;}
    header{padding-top:calc(10px + env(safe-area-inset-top));}
    #appName{font-size:12px;}
    #clockTime{font-size:24px;}
    #weatherBlock .wDays{display:none;} /* multi-day strip doesn't fit; today's conditions still show */
    #countdownChip{font-size:11px;padding:6px 10px;}

    /* Nav: comfortably tappable, and never lets 6 labels overflow/wrap oddly. */
    nav button{padding:10px 0;min-height:48px;justify-content:center;}
    nav .navIcon{font-size:18px;}
    nav .navLabel{font-size:9px;}

    main{padding-left:max(10px, env(safe-area-inset-left));padding-right:max(10px, env(safe-area-inset-right));}
    .card{padding:14px;border-radius:16px;}
    .col2{gap:12px;}

    /* Rows people tap on (chores, list items, settings) get more room. */
    .choreRow,.itemRow{padding:11px 0;}
    .checkBox{width:32px;height:32px;border-radius:9px;font-size:17px;}
    .routineStep .checkBox{width:26px;height:26px;}
    .settRow{padding:12px 0;flex-wrap:wrap;}
    .colorDot{width:16px;height:16px;}

    /* Buttons: bigger hit area, and full-width where that reads more like
       an app control than a squeezed inline link. */
    .miniBtn{padding:9px 14px;font-size:13px;}
    .addBtn{padding:11px 16px;font-size:14px;}
    .redeemBtn{padding:9px 14px;font-size:13px;}
    #addEventBtn{padding:10px 16px;}
    .addLine{flex-wrap:wrap;}

<script>
/* =========================================================================
   FAMILY KITCHEN CALENDAR — single-file app
   - Runs entirely client-side. Family data (profiles, chores, lists,
     meals, manual events, settings) is kept in this browser's
     localStorage AND, once you sign in with Google, synced live to a
     Firestore document shared by everyone in your household — so
     signing in on another device shows the same calendar automatically.
   - Calendar sync (Google / Outlook) works by fetching your calendar's
     public ICS feed URL through a free public CORS-proxy, since browsers
     block direct cross-origin fetches to calendar.google.com/outlook.
     Free proxies can be rate-limited or go offline — if sync stops
     working, swap the proxy template in Settings, or ask Claude to help
     wire up a small free Cloudflare Worker as a more reliable proxy.
   ========================================================================= */

const STORAGE_KEY = "kitchenCalendarState_v1";
const DEFAULT_COLORS = ["#ff7a59","#4f9dde","#5cb85c","#f0ad4e","#9b59b6","#e75480","#2ecc71","#3498db"];

function defaultState(){
  return {
    // Starts empty on purpose — every household adds its own family
    // members (Settings → Family Members) instead of inheriting a
    // hardcoded sample roster.
    profiles:[],
    feeds:[], // {id, label, url, profileId, proxy}
    events:[], // {id, title, start (ISO), end(ISO), allDay, profileId, location, notes, feedId?, repeat}
    chores:[], // {id, name, profileId, frequency: 'daily'|'weekly', days:[0-6] for weekly}
    choreLog:{}, // "choreId_YYYY-MM-DD": true
    routines:[], // {id, name, profileId, steps:[{id, text}]}
    routineLog:{}, // "routineId_stepId_YYYY-MM-DD": true, plus "routineId_bonus_YYYY-MM-DD": true once the daily completion star has been awarded
    starBalance:{}, // profileId -> lifetime redeemable star count
    rewards:[ // shared catalog, redeemable by any profile
      {id:"r1", name:"30 min extra screen time", cost:5},
      {id:"r2", name:"Pick a movie for family night", cost:10},
      {id:"r3", name:"Ice cream treat", cost:8}
    ],
    redemptions:[], // {id, profileId, rewardName, cost, date}
    lists:[
      {id:"l1", name:"Grocery", color:"#5cb85c", items:[]}
    ],
    meals:{}, // "YYYY-MM-DD": {breakfast,lunch,dinner}
    photos:[], // {id, data (base64 dataURL)}
    settings:{
      cityName:"", lat:null, lon:null, tz:"auto",
      proxyTemplate:"https://api.allorigins.win/raw?url={url}",
      syncMinutes:20,
      countdownTitle:"", countdownDate:"",
      screensaverEnabled:false, screensaverIdleMinutes:5,
      // One-way meal import from Mealie (mealie.io) — a free, open-source,
      // self-hostable meal planner with a real API. See syncMealsFromMealie().
      mealieUrl:"", mealieToken:"", mealieUseProxy:false,
      mealieLastSync:"", mealieLastError:""
    }
  };
}

let state = loadState();

// --- Account / household sync state (see AUTH / HOUSEHOLD SYNC block near
// the bottom of this file for the functions that use these). ---
let householdCode = null;       // Firestore household doc id once joined/created
let currentUser = null;         // Firebase Auth user object once signed in
let householdUnsub = null;      // unsubscribe fn for the live Firestore listener
let applyingRemoteUpdate = false; // true while merging a remote change, to avoid re-echoing it back
let appBooted = false;          // true once boot() has run at least once
let householdDataLoaded = false; // true once the first Firestore snapshot for this household has been merged in
let pendingRemoteState = null;  // stashed incoming household data while renderSyncConflictScreen() waits on a choice
let selectedChoreDate = null;   // which day's chores the Chores tab is showing; null means "today" (tap a day in the strip to change it)

// One-time (non-recurring) chores used to have no concept of which day
// they belonged to, so they showed up under every day of the week forever
// -- functionally identical to a recurring chore except for the badge text.
// This backfills a `date` onto any one-time chore that doesn't have one yet
// so it settles onto a single real day instead. Purely additive: nothing is
// removed or renamed, chores keep their id/name/history, this only fills in
// a missing field. Safe to call repeatedly (a no-op once every chore has a
// date).
function migrateChoreDates(s){
  if(!s || !Array.isArray(s.chores)) return s;
  const todayISO = isoDate(new Date());
  s.chores.forEach(c=>{
    if(c.recurring === false && !c.date) c.date = todayISO;
  });
  return s;
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const saved = JSON.parse(raw);
      const merged = Object.assign(defaultState(), saved);
      // Settings is nested, so a plain Object.assign would drop any new
      // default keys (like screensaverEnabled) that an older save doesn't
      // have yet. Backfill those explicitly instead.
      merged.settings = Object.assign(defaultState().settings, saved.settings||{});
      migrateChoreDates(merged);
      return merged;
    }
  }catch(e){ console.warn("Could not load saved data, starting fresh.", e); }
  return defaultState();
}
function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  // If signed in and part of a household, also push to Firestore (debounced
  // so rapid edits don't spam the network) so other devices stay in sync.
  if(householdCode && !applyingRemoteUpdate && window.__firebase){
    clearTimeout(window.__remoteWriteTimer);
    window.__remoteWriteTimer = setTimeout(pushStateToCloud, 800);
  }
}
function pushStateToCloud(){
  clearTimeout(window.__remoteWriteTimer);
  window.__remoteWriteTimer = null;
  if(!householdCode || !window.__firebase) return;
  const { db, doc, setDoc } = window.__firebase;
  setDoc(doc(db, "households", householdCode, "data", "state"), state)
    .catch(e=> console.warn("Cloud sync failed, change is still saved locally:", e));
}
// If the tablet/tab is closed or backgrounded right after an edit (e.g.
// typing a meal then immediately switching tabs), make sure that edit
// still reaches the cloud instead of waiting out the rest of the debounce.
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState==="hidden" && window.__remoteWriteTimer) pushStateToCloud();
});

// Downloads whatever is currently in `state` as a JSON file — used by the
// Settings backup button, and also offered as a safety net on the
// sync-conflict screen before anything gets overwritten either direction.
function downloadBackupFile(stateToExport, filename){
  const blob=new Blob([JSON.stringify(stateToExport||state,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=filename||"kitchen-calendar-backup.json"; a.click();
}

// Does this device's current local state contain anything a person
// actually entered, beyond the untouched defaults a brand-new install
// starts with? Used to detect "this device has real, possibly-unsynced
// data" before letting a cloud sync silently overwrite it.
function localStateHasRealData(s){
  s = s || state;
  if(s.profiles && s.profiles.length) return true;
  if(s.chores && s.chores.length) return true;
  if(s.events && s.events.length) return true;
  if(s.routines && s.routines.length) return true;
  if(s.feeds && s.feeds.length) return true;
  if(s.meals && Object.keys(s.meals).length) return true;
  if(s.redemptions && s.redemptions.length) return true;
  if(s.lists && s.lists.some(l=> (l.items&&l.items.length>0) || (l.name||"").toLowerCase()!=="grocery")) return true;
  return false;
}

/* ---------------------------- date helpers ---------------------------- */
function pad(n){ return n<10 ? "0"+n : ""+n; }
function isoDate(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function startOfWeek(d){ const x=new Date(d); const day=x.getDay(); x.setDate(x.getDate()-day); x.setHours(0,0,0,0); return x; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

/* =========================================================================
   ICS PARSING
   Minimal RFC5545 parser: unfolds lines, reads VEVENT blocks, expands
   simple RRULEs (FREQ=DAILY/WEEKLY/MONTHLY/YEARLY, INTERVAL, COUNT, UNTIL,
   BYDAY) for a window around "today". Complex recurrence edge cases
   (EXDATE overrides, RDATE, multi-part BYDAY like "2MO") are not fully
   handled — verify important recurring events display correctly and
   report anything wrong so it can be patched.
   ========================================================================= */
function unfoldICS(text){
  const lines = text.replace(/\r\n/g,"\n").split("\n");
  const out=[];
  for(const line of lines){
    if((line.startsWith(" ")||line.startsWith("\t")) && out.length){
      out[out.length-1]+= line.slice(1);
    } else out.push(line);
  }
  return out;
}
function parseICSDate(val, params){
  // val like 20260401 or 20260401T130000 or 20260401T130000Z
  const isDateOnly = /^\d{8}$/.test(val);
  const y=+val.slice(0,4), mo=+val.slice(4,6)-1, da=+val.slice(6,8);
  if(isDateOnly) return {date:new Date(y,mo,da), allDay:true};
  const h=+val.slice(9,11)||0, mi=+val.slice(11,13)||0, se=+val.slice(13,15)||0;
  if(val.endsWith("Z")){
    return {date:new Date(Date.UTC(y,mo,da,h,mi,se)), allDay:false};
  }
  // Treat TZID / floating times as local time (good enough for a household display).
  return {date:new Date(y,mo,da,h,mi,se), allDay:false};
}
function parseICS(text, feedId, profileId){
  const lines = unfoldICS(text);
  const events=[];
  let cur=null;
  for(const raw of lines){
    const line=raw.trim();
    if(line==="BEGIN:VEVENT"){ cur={}; continue; }
    if(line==="END:VEVENT"){ if(cur) events.push(cur); cur=null; continue; }
    if(!cur) continue;
    const idx=line.indexOf(":");
    if(idx<0) continue;
    let key=line.slice(0,idx), val=line.slice(idx+1);
    const params={};
    if(key.includes(";")){
      const parts=key.split(";"); key=parts[0];
      for(let i=1;i<parts.length;i++){ const [pk,pv]=parts[i].split("="); params[pk]=pv; }
    }
    if(key==="DTSTART") cur.start=parseICSDate(val, params);
    else if(key==="DTEND") cur.end=parseICSDate(val, params);
    else if(key==="SUMMARY") cur.title=val.replace(/\\,/g,",").replace(/\\n/gi," ");
    else if(key==="LOCATION") cur.location=val.replace(/\\,/g,",");
    else if(key==="DESCRIPTION") cur.notes=val.replace(/\\,/g,",").replace(/\\n/gi," ");
    else if(key==="UID") cur.uid=val;
    else if(key==="RRULE") cur.rrule=val;
  }

  const windowStart = addDays(new Date(),-45);
  const windowEnd = addDays(new Date(),240);
  const out=[];

  for(const ev of events){
    if(!ev.start) continue;
    const durationMs = (ev.end? ev.end.date.getTime() : ev.start.date.getTime()) - ev.start.date.getTime();
    const base = {
      title: ev.title || "(untitled event)",
      location: ev.location || "",
      notes: ev.notes || "",
      allDay: !!ev.start.allDay,
      feedId, profileId
    };
    if(!ev.rrule){
      out.push(Object.assign({}, base, {
        id: (ev.uid||Math.random().toString(36))+"_0",
        start: ev.start.date.toISOString(),
        end: new Date(ev.start.date.getTime()+Math.max(durationMs,0)).toISOString()
      }));
      continue;
    }
    // expand simple RRULE
    const rule={};
    ev.rrule.split(";").forEach(p=>{ const [k,v]=p.split("="); rule[k]=v; });
    const freq=rule.FREQ, interval=parseInt(rule.INTERVAL||"1",10);
    const count = rule.COUNT ? parseInt(rule.COUNT,10) : null;
    const until = rule.UNTIL ? parseICSDate(rule.UNTIL.replace("Z",""),{}).date : null;
    const byday = rule.BYDAY ? rule.BYDAY.split(",") : null;
    const dayMap={SU:0,MO:1,TU:2,WE:3,TH:4,FR:5,SA:6};

    let n=0, cursor=new Date(ev.start.date), safety=0;
    // Cap generous enough to walk a weekly BYDAY rule (which advances one
    // day per loop) from a start date decades in the past up to the
    // display window, without ever meaningfully slowing things down.
    while(safety<20000){
      safety++;
      if(count!=null && n>=count) break;
      if(until && cursor>until) break;
      if(cursor>windowEnd) break;
      let occursToday=true;
      if(freq==="WEEKLY" && byday){
        occursToday = byday.some(bd=>dayMap[bd.slice(-2)]===cursor.getDay());
      }
      if(occursToday){
        // n (the series index) must advance for every real occurrence of the
        // rule, even ones outside our display window, so COUNT/UNTIL stay
        // accurate to the true recurrence series.
        if(cursor>=windowStart && cursor<=windowEnd){
          out.push(Object.assign({}, base, {
            id:(ev.uid||Math.random().toString(36))+"_"+n,
            start: cursor.toISOString(),
            end: new Date(cursor.getTime()+Math.max(durationMs,0)).toISOString()
          }));
        }
        n++;
      }
      // advance cursor
      if(freq==="DAILY") cursor=addDays(cursor, interval);
      else if(freq==="WEEKLY"){
        if(byday){ cursor=addDays(cursor,1); }
        else cursor=addDays(cursor,7*interval);
      }
      else if(freq==="MONTHLY"){ const d=new Date(cursor); d.setMonth(d.getMonth()+interval); cursor=d; }
      else if(freq==="YEARLY"){ const d=new Date(cursor); d.setFullYear(d.getFullYear()+interval); cursor=d; }
      else break; // unsupported freq, stop expanding
      if(freq==="WEEKLY" && byday && cursor.getDay()===0 && n>0){
        // after finishing a week block, jump by (interval-1) extra weeks
        cursor = addDays(cursor, 7*(interval-1));
      }
    }
  }
  return out;
}

async function syncFeed(feed){
  // Try the user's configured proxy first, then fall back to a second public
  // proxy automatically. This matters because some networks' content
  // filtering (parental controls, school/corporate firewalls) block known
  // proxy domains like allorigins.win outright -- but some of those filters
  // respond with their own HTTP 200 "blocked" page instead of a network
  // error, so a plain fetch() would otherwise look like a "successful" sync
  // that silently returns zero events. To catch that, we also verify the
  // response actually looks like a calendar file before accepting it.
  const FALLBACK_PROXY = "https://corsproxy.io/?url={url}";
  const templates = [state.settings.proxyTemplate, FALLBACK_PROXY].filter((v,i,a)=> v && a.indexOf(v)===i);
  let lastErr = null;
  for(const template of templates){
    try{
      const proxied = template.replace("{url}", encodeURIComponent(feed.url));
      const res = await fetch(proxied);
      if(!res.ok) throw new Error("HTTP "+res.status);
      const text = await res.text();
      if(!text.includes("BEGIN:VCALENDAR")){
        throw new Error("Got a response, but it wasn't a real calendar file -- likely blocked by network content filtering, a sign-in wall, or the link isn't a direct ICS/webcal link.");
      }
      return parseICS(text, feed.id, feed.profileId);
    }catch(e){
      lastErr = e;
    }
  }
  throw lastErr || new Error("Sync failed");
}
async function syncAllFeeds(showAlert){
  let anyError=null;
  for(const feed of state.feeds){
    try{
      const parsed = await syncFeed(feed);
      state.events = state.events.filter(e=>e.feedId!==feed.id).concat(parsed);
      feed.lastSync = new Date().toISOString();
      feed.lastError = null;
    }catch(e){
      feed.lastError = e.message;
      anyError = e;
    }
  }
  saveState();
  if(currentTab==="calendar") renderTab();
  if(currentTab==="settings") renderTab();
  if(showAlert && anyError) alert("Some calendars failed to sync: "+anyError.message+"\nCheck the feed link / proxy in Settings.");
}

/* ============================ WEATHER ============================ */
function reverseGeocode(lat, lon){
  const url=`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`;
  return fetch(url).then(r=>r.json()).then(d=>{
    const place = d.city || d.locality || "Current location";
    return d.principalSubdivision ? `${place}, ${d.principalSubdivision}` : place;
  }).catch(()=> "Current location");
}
async function geocodeCity(name){
  const url="https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(name)+"&count=1";
  const res= await fetch(url);
  const data= await res.json();
  if(data.results && data.results.length){
    const r=data.results[0];
    return {lat:r.latitude, lon:r.longitude, label:r.name+(r.admin1?", "+r.admin1:"")};
  }
  throw new Error("City not found");
}
function weatherEmoji(code){
  if(code===0) return "☀️";
  if([1,2].includes(code)) return "🌤";
  if(code===3) return "☁️";
  if([45,48].includes(code)) return "🌫";
  if([51,53,55,56,57].includes(code)) return "🌦";
  if([61,63,65,80,81,82].includes(code)) return "🌧";
  if([71,73,75,77,85,86].includes(code)) return "❄️";
  if([95,96,99].includes(code)) return "⛈";
  return "🌡";
}
// WMO weather codes used by Open-Meteo — https://open-meteo.com/en/docs
function weatherText(code){
  const map={
    0:"Clear sky", 1:"Mainly clear", 2:"Partly cloudy", 3:"Overcast",
    45:"Foggy", 48:"Foggy",
    51:"Light drizzle", 53:"Drizzle", 55:"Heavy drizzle",
    56:"Freezing drizzle", 57:"Freezing drizzle",
    61:"Light rain", 63:"Rain", 65:"Heavy rain",
    66:"Freezing rain", 67:"Freezing rain",
    71:"Light snow", 73:"Snow", 75:"Heavy snow", 77:"Snow grains",
    80:"Rain showers", 81:"Rain showers", 82:"Heavy showers",
    85:"Snow showers", 86:"Snow showers",
    95:"Thunderstorm", 96:"Thunderstorm w/ hail", 99:"Thunderstorm w/ hail"
  };
  return map[code] || "—";
}
let weatherCache=null;
async function refreshWeather(){
  const s=state.settings;
  if(s.lat==null || s.lon==null){
    document.getElementById("weatherBlock").innerHTML = "<span style='color:var(--muted);font-size:13px'>Add your location in Settings for weather</span>";
    return;
  }
  try{
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${s.lat}&longitude=${s.lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,weather_code&temperature_unit=fahrenheit&timezone=${encodeURIComponent(s.tz||"auto")}&forecast_days=5`;
    const res= await fetch(url);
    const data= await res.json();
    weatherCache=data;
    renderWeatherBlock(data);
  }catch(e){
    document.getElementById("weatherBlock").innerHTML = "<span style='color:var(--muted);font-size:13px'>Weather unavailable</span>";
  }
}
function renderWeatherBlock(data){
  const cur=data.current, daily=data.daily;
  let html = `<span class="wIcon">${weatherEmoji(cur.weather_code)}</span>
    <div class="wNow">
      <span class="wTemp">${Math.round(cur.temperature_2m)}°</span>
      <span class="wDesc">${weatherText(cur.weather_code)}${daily.temperature_2m_max[0]!=null?` · H:${Math.round(daily.temperature_2m_max[0])}° L:${Math.round(daily.temperature_2m_min[0])}°`:''}</span>
    </div>
    <div class="wDays">`;
  for(let i=1;i<Math.min(4,daily.time.length);i++){
    const d=new Date(daily.time[i]+"T00:00:00");
    html+=`<span>${DOW[d.getDay()]} ${weatherEmoji(daily.weather_code[i])} ${Math.round(daily.temperature_2m_max[i])}°</span>`;
  }
  html+="</div>";
  document.getElementById("weatherBlock").innerHTML=html;
}
function dayForecast(dateObj){
  if(!weatherCache) return "";
  const iso=isoDate(dateObj);
  const idx = weatherCache.daily.time.indexOf(iso);
  if(idx<0) return "";
  return `${weatherEmoji(weatherCache.daily.weather_code[idx])} ${Math.round(weatherCache.daily.temperature_2m_max[idx])}°/${Math.round(weatherCache.daily.temperature_2m_min[idx])}°`;
}

/* ============================ CLOCK / COUNTDOWN ============================ */
function timeOfDayGreeting(hour){
  if(hour<5) return "Still up";
  if(hour<12) return "Good morning";
  if(hour<17) return "Good afternoon";
  if(hour<21) return "Good evening";
  return "Good night";
}
function joinNames(names){
  if(names.length===0) return "";
  if(names.length===1) return names[0];
  if(names.length===2) return names[0]+" & "+names[1];
  return names.slice(0,-1).join(", ")+" & "+names[names.length-1];
}
const GREETING_EMOJI = ["😊","🌟","☀️","💛","🙌","🌤️"];
function renderGreeting(){
  const now=new Date();
  const greeting = timeOfDayGreeting(now.getHours());
  const names = state.profiles.map(p=>p.name).filter(Boolean);
  const emoji = GREETING_EMOJI[now.getMinutes() % GREETING_EMOJI.length];
  const text = names.length
    ? `${greeting}, ${joinNames(names)}! ${emoji}`
    : `${greeting}! ${emoji}`;
  const el=document.getElementById("appName");
  if(el) el.textContent = text;
}
function tickClock(){
  const now=new Date();
  let h=now.getHours(); const ampm= h>=12?"PM":"AM"; h=h%12; if(h===0)h=12;
  document.getElementById("clockTime").textContent = h+":"+pad(now.getMinutes())+" "+ampm;
  document.getElementById("clockDate").textContent = DOW[now.getDay()]===undefined?"":
    ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][now.getDay()]+", "+MONTHS[now.getMonth()]+" "+now.getDate();
  renderGreeting();
  renderCountdown();
}
function renderCountdown(){
  const el=document.getElementById("countdownChip");
  const s=state.settings;
  if(!s.countdownDate || !s.countdownTitle){ el.textContent="No countdown set"; el.style.opacity=.5; return; }
  el.style.opacity=1;
  const target=new Date(s.countdownDate+"T00:00:00");
  const now=new Date(); now.setHours(0,0,0,0);
  const days=Math.round((target-now)/86400000);
  if(days>0) el.textContent = `🎉 ${days} day${days===1?"":"s"} until ${s.countdownTitle}`;
  else if(days===0) el.textContent = `🎉 Today is ${s.countdownTitle}!`;
  else el.textContent = `${s.countdownTitle} has passed`;
}

// The nav is a floating popover: tap the round button (bottom-right) to
// reveal it, tap a backdrop tap or a menu choice to close it again.
function closeNavMenu(){
  document.getElementById("mainNav").classList.remove("open");
  document.getElementById("navFab").classList.remove("open");
  document.getElementById("navBackdrop").classList.remove("open");
}
function toggleNavMenu(){
  const open = document.getElementById("mainNav").classList.toggle("open");
  document.getElementById("navFab").classList.toggle("open", open);
  document.getElementById("navBackdrop").classList.toggle("open", open);
}
document.getElementById("navFab").addEventListener("click", toggleNavMenu);
document.getElementById("navBackdrop").addEventListener("click", closeNavMenu);

// Single entry point for switching tabs, used by the nav menu and by any
// tappable element elsewhere (like the Home dashboard) that jumps to a
// specific tab for more detail.
function goToTab(tab){
  currentTab=tab;
  document.querySelectorAll("#mainNav button").forEach(b=>b.classList.toggle("active", b.dataset.tab===tab));
  closeNavMenu();
  renderTab();
}
document.getElementById("mainNav").addEventListener("click", e=>{
  const btn=e.target.closest("button[data-tab]"); if(!btn) return;

});

function renderTab(){

  else if(currentTab==="chores") main.innerHTML = choresHTML();
  else if(currentTab==="lists") main.innerHTML = listsHTML();

}

function profileById(id){ return state.profiles.find(p=>p.id===id); }
function profileColor(id){ const p=profileById(id); return p? p.color : "#999"; }

function eventsForDay(d){

function passesFilter(e){
  return activeProfileFilter.size===0 || activeProfileFilter.has(e.profileId);
}
function monthGridHTML(){
  const first=new Date(calCursor.getFullYear(),calCursor.getMonth(),1);
  const gridStart=startOfWeek(first);
  let html = `<div class="monthGrid">`;
  DOW.forEach(d=> html+=`<div class="dowRow">${d}</div>`);
  const today=new Date();
  for(let i=0;i<42;i++){
    const d=addDays(gridStart,i);

    const isToday = sameDay(d,today);
    const dayEvents = eventsForDay(d).filter(passesFilter);
    const shown=dayEvents.slice(0,3);
    const more = dayEvents.length-shown.length;
    html+=`<div class="dayCell ${isOther?'other':''} ${isToday?'today':''}" data-daycell="${isoDate(d)}">
      <div class="dayNum"><span>${d.getDate()}</span><span class="dayWeather">${dayForecast(d)}</span></div>
      ${shown.map(e=>`<div class="evChip" style="background:${profileColor(e.profileId)}">${e.allDay?'':fmtTime(e.start)+' '}${escapeHtml(e.title)}</div>`).join("")}
      ${more>0?`<div class="moreChip">+${more} more</div>`:""}
    </div>`;
  }
  html+="</div>";

function weekHTML(ws){
  let html=`<div class="weekCols">`;
  const today=new Date();
  for(let i=0;i<7;i++){
    const d=addDays(ws,i);
    const dayEvents = eventsForDay(d).filter(passesFilter);
    html+=`<div class="weekCol" data-daycell="${isoDate(d)}">
      <h4>${DOW[d.getDay()]}<span>${d.getDate()}</span></h4>
      <div style="font-size:10px;color:var(--muted);text-align:center;margin-bottom:6px">${dayForecast(d)}</div>
      ${dayEvents.map(e=>`<div class="agendaEv" style="background:${profileColor(e.profileId)}"><b>${e.allDay?'All day':fmtTime(e.start)}</b>${escapeHtml(e.title)}</div>`).join("") || `<div style="font-size:12px;color:var(--muted);text-align:center">—</div>`}
    </div>`;
  }
  html+="</div>";

}
function dayHTML(d){
  const dayEvents = eventsForDay(d).filter(passesFilter);
  return `<div class="card dayAgenda" data-daycell="${isoDate(d)}">
    <div style="color:var(--muted);font-size:13px;margin-bottom:10px">${dayForecast(d)}</div>

function fmtTime(iso){
  const d=new Date(iso);
  let h=d.getHours(); const ampm=h>=12?"pm":"am"; h=h%12; if(h===0)h=12;
  return h+(d.getMinutes()? ":"+pad(d.getMinutes()):"")+ampm;
}
function escapeHtml(s){ return (s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function attachTabEvents(){
  if(currentTab==="calendar"){
    document.getElementById("calPrev").onclick=()=>{ shiftCal(-1); };

      cell.addEventListener("click",()=> openDayModal(cell.dataset.daycell));
    });
  }
  if(currentTab==="home") attachHomeEvents();
  if(currentTab==="chores") attachChoreEvents();
  if(currentTab==="lists") attachListEvents();
  if(currentTab==="meals") attachMealEvents();
  if(currentTab==="settings") attachSettingsEvents();
}
function shiftCal(dir){
  if(calView==="month") calCursor=new Date(calCursor.getFullYear(),calCursor.getMonth()+dir,1);

  document.getElementById("modalSave").onclick=()=>{

/* ---------------------------- CHORES TAB ---------------------------- */
function weekRangeLabel(){
  const ws=startOfWeek(new Date());
  return isoDate(ws)+"_to_"+isoDate(addDays(ws,6));
}
function starCount(profileId){
  const ws=startOfWeek(new Date());
  let count=0;
  for(let i=0;i<7;i++){
    const dISO=isoDate(addDays(ws,i));
    state.chores.filter(c=>c.profileId===profileId).forEach(c=>{
      if(state.choreLog[c.id+"_"+dISO]) count++;
    });
  }
  return count;
}
function starBalanceOf(profileId){ return state.starBalance[profileId]||0; }
// Which of a person's chores actually apply on a given day: recurring ones
// apply every day; one-time ones only apply on the specific day they're
// scheduled for (falling back to today if somehow still missing a date --
// see migrateChoreDates, which normally backfills this on load).
function choresForDay(profileId, dateISO){
  const todayISO = isoDate(new Date());
  return state.chores.filter(c=>{
    if(c.profileId!==profileId) return false;
    if(c.recurring !== false) return true; // recurring (or legacy/unset) -> every day
    return (c.date || todayISO) === dateISO;
  });
}
function choresDoneToday(profileId){
  const todayISO = isoDate(new Date());
  const myChores = choresForDay(profileId, todayISO);
  const done = myChores.filter(c=>state.choreLog[c.id+"_"+todayISO]).length;
  return {done, total: myChores.length};
}
function weeklyChoreStrip(profileId){
  const ws=startOfWeek(new Date());
  const today=new Date();
  const out=[];
  for(let i=0;i<7;i++){
    const d=addDays(ws,i);
    const dISO=isoDate(d);
    const dayChores = choresForDay(profileId, dISO);
    const done = dayChores.filter(c=>state.choreLog[c.id+"_"+dISO]).length;
    out.push({label:DOW[d.getDay()], done, total:dayChores.length, isToday:sameDay(d,today), dateISO:dISO});
  }
  return out;
}
function routineProgress(routine, dateISO){
  const done = routine.steps.filter(s=>state.routineLog[routine.id+"_"+s.id+"_"+dateISO]).length;
  return {done, total: routine.steps.length};
}
function choresHTML(){
  const todayISO = isoDate(new Date());
  const viewDate = selectedChoreDate || todayISO;
  const viewLabel = viewDate===todayISO ? "Today" : new Date(viewDate+"T00:00:00").toLocaleDateString(undefined,{weekday:'long', month:'short', day:'numeric'});
  if(!state.profiles.length){
    return `<div class="card"><h3>👋 Add your family first</h3><p class="helpText">Head to <b>Settings → Family Members</b> to add everyone, then come back here to set up chores for each person.</p></div>`;

    const myChores = choresForDay(p.id, viewDate);
    const myRoutines = state.routines.filter(r=>r.profileId===p.id);
    const myRedemptions = state.redemptions.filter(r=>r.profileId===p.id).slice(-2).reverse();
    const todayCount = choresDoneToday(p.id);
    const strip = weeklyChoreStrip(p.id);
    return `<div class="card">
      <h3><span class="titleGroup"><span class="iconBadge" style="background:${p.color}22;color:${p.color}">🧒</span><span style="color:${p.color}">${escapeHtml(p.name)}'s Chores</span></span>
        <span style="display:flex;gap:6px;align-items:center"><span class="todayCounter">${todayCount.done}/${todayCount.total} today</span><span class="starTally">⭐ ${starCount(p.id)} this week</span></span>
      </h3>
      <div class="dayStrip">
        ${strip.map(d=>`<div class="dayStripItem ${d.isToday?'today':''} ${d.dateISO===viewDate?'selected':''}" data-choreday="${d.dateISO}" title="Tap to see/add chores for this day">${d.label}<span class="dsCount">${d.done}/${d.total}</span></div>`).join("")}
      </div>
      <p class="helpText" style="margin:6px 0 8px">Showing: <b>${viewLabel}</b>${viewDate!==todayISO?` · <a href="#" data-backtotoday="1" style="color:var(--accent)">back to today</a>`:''}</p>
      ${myChores.map(c=>{
        const done = !!state.choreLog[c.id+"_"+viewDate];
        // Older saved chores don't have a `recurring` field yet — treat
        // that as "recurring" so nothing that used to show every day
        // silently disappears after this update.
        const isRecurring = c.recurring !== false;
        return `<div class="choreRow">
          <div class="checkBox ${done?'done':''}" data-chore="${c.id}" data-chorewhen="${viewDate}">${done?'✓':''}</div>
          <input type="text" class="editableText rowText ${done?'done':''}" data-chorename="${c.id}" value="${escapeHtml(c.name)}">
          <label class="recurToggle" title="Repeats every day, rather than being a one-time task">
            <input type="checkbox" data-chorerecur="${c.id}" ${isRecurring?'checked':''}>
            <span>${isRecurring?'🔁 Daily':'One-time'}</span>
          </label>
          <button class="smallBtn" data-delchore="${c.id}">✕</button>
          ${(!isRecurring && !done) ? `
          <div class="choreReschedule">
            <button class="miniBtn" data-pushtomorrow="${c.id}|${viewDate}">➜ Push to tomorrow</button>
            <input type="date" data-choremove="${c.id}" value="${c.date||viewDate}" title="Move this task to a specific day">
          </div>` : ''}
        </div>`;
      }).join("") || `<p style="color:var(--muted);font-size:13px">No chores for ${viewDate===todayISO?'today':'this day'} yet.</p>`}
      <div class="addLine">
        <input type="text" placeholder="New chore..." data-newchore="${p.id}">
        <input type="date" data-newchoredate="${p.id}" value="${viewDate}" title="Which day is this for? (only matters for one-time chores -- daily chores show every day regardless)">
        <button data-addchorebtn="${p.id}">Add</button>
      </div>

      <div class="routinesSection">
        <h4>🔁 Routines</h4>
        ${myRoutines.map(r=>{
          const prog = routineProgress(r, todayISO);
          const complete = prog.total>0 && prog.done===prog.total;
          return `<div class="routineCard">
            <div class="routineHead">
              <b>${escapeHtml(r.name)}</b>
              <span style="display:flex;align-items:center;gap:8px">
                <span class="routineProgress">${prog.done}/${prog.total}</span>
                <button class="smallBtn" data-delroutine="${r.id}">✕</button>
              </span>
            </div>
            ${r.steps.map(s=>{
              const sdone = !!state.routineLog[r.id+"_"+s.id+"_"+todayISO];
              return `<div class="routineStep">
                <div class="checkBox ${sdone?'done':''}" data-routinestep="${r.id}|${s.id}">${sdone?'✓':''}</div>
                <div class="rowText ${sdone?'done':''}">${escapeHtml(s.text)}</div>
              </div>`;
            }).join("")}
            ${complete? `<div class="routineDone">🎉 Routine complete!</div>` : ""}
          </div>`;
        }).join("") || `<p style="color:var(--muted);font-size:13px">No routines yet — group steps like "brush teeth, get dressed, eat breakfast" into a Morning Routine below.</p>`}
        <div class="field"><input type="text" placeholder="Routine name (e.g. Morning Routine)" data-newroutinename="${p.id}"></div>
        <div class="field"><textarea rows="2" placeholder="One step per line: brush teeth&#10;get dressed&#10;eat breakfast" data-newroutinesteps="${p.id}"></textarea></div>
        <button class="miniBtn" data-addroutinebtn="${p.id}">+ Add Routine</button>
      </div>

      <div class="rewardsSection">
        <h4>🎁 Rewards <span class="balancePill">⭐ ${starBalanceOf(p.id)} saved</span></h4>
        ${state.rewards.length? state.rewards.map(r=>{
          const afford = starBalanceOf(p.id) >= r.cost;
          return `<div class="rewardRow">
            <div class="rewardName">${escapeHtml(r.name)}</div>
            <div class="rewardCost">⭐ ${r.cost}</div>
            <button class="redeemBtn" data-redeem="${p.id}|${r.id}" ${afford?'':'disabled'}>Redeem</button>
          </div>`;
        }).join("") : `<p style="color:var(--muted);font-size:13px">No rewards set up yet — add some in Settings.</p>`}
        ${myRedemptions.length? `<div class="redeemLog">${myRedemptions.map(r=>`Redeemed "${escapeHtml(r.rewardName)}" on ${new Date(r.date).toLocaleDateString()}`).join(" · ")}</div>` : ""}
      </div>
    </div>`;
  }).join("") + `</div>`;
}
function toggleChoreDone(id, dateISO){
  const dISO = dateISO || isoDate(new Date());
  const key=id+"_"+dISO;
  const chore = state.chores.find(c=>c.id===id);
  if(!chore) return;
  const wasDone = !!state.choreLog[key];
  state.choreLog[key] = !wasDone;
  const bal = starBalanceOf(chore.profileId);
  state.starBalance[chore.profileId] = wasDone ? Math.max(0, bal-1) : bal+1;
  saveState(); renderTab();
}
function attachChoreEvents(){
  document.querySelectorAll("[data-chore]").forEach(el=> el.onclick=()=> toggleChoreDone(el.dataset.chore, el.dataset.chorewhen));
  document.querySelectorAll("[data-delchore]").forEach(el=> el.onclick=()=>{
    state.chores = state.chores.filter(c=>c.id!==el.dataset.delchore);
    saveState(); renderTab();
  });

  // Tap a day in the weekly strip to browse (and add) that day's chores
  // instead of always being stuck looking at today.
  document.querySelectorAll("[data-choreday]").forEach(el=> el.onclick=()=>{
    selectedChoreDate = el.dataset.choreday;
    renderTab();
  });
  document.querySelectorAll("[data-backtotoday]").forEach(el=> el.onclick=(e)=>{
    e.preventDefault();
    selectedChoreDate = null;
    renderTab();
  });

  // Rename a chore in place — no more delete-and-re-add just to fix a typo
  // or change what it's called.
  function commitChoreName(inp){
    const chore = state.chores.find(c=>c.id===inp.dataset.chorename); if(!chore) return;
    const val = inp.value.trim();
    chore.name = val || chore.name; // never save a blank name
    inp.value = chore.name;
    saveState();
  }
  document.querySelectorAll("[data-chorename]").forEach(inp=>{
    inp.addEventListener("change", ()=> commitChoreName(inp));
    inp.addEventListener("keydown", (e)=>{ if(e.key==="Enter"){ e.preventDefault(); commitChoreName(inp); inp.blur(); } });
  });

  // Recurring (repeats daily) vs. one-time — the "🔁 Daily" badge only
  // shows for chores where this is checked. Switching a chore to one-time
  // needs a day to "land" on: use whichever day is currently being viewed
  // (falls back to today) rather than leaving it dateless, which is what
  // used to make one-time chores show up on every day forever.
  document.querySelectorAll("[data-chorerecur]").forEach(cb=>{
    cb.addEventListener("change", ()=>{
      const chore = state.chores.find(c=>c.id===cb.dataset.chorerecur); if(!chore) return;
      chore.recurring = cb.checked;
      if(!cb.checked && !chore.date) chore.date = selectedChoreDate || isoDate(new Date());
      saveState(); renderTab();
    });
  });

  // Quick "push to tomorrow" for an undone one-time chore -- the common
  // case (didn't get to it today, move it to the next day) in one tap
  // instead of deleting and re-adding it.
  document.querySelectorAll("[data-pushtomorrow]").forEach(btn=> btn.onclick=()=>{
    const [choreId, fromDate] = btn.dataset.pushtomorrow.split("|");
    const chore = state.chores.find(c=>c.id===choreId); if(!chore) return;
    chore.date = isoDate(addDays(new Date(fromDate+"T00:00:00"), 1));
    saveState(); renderTab();
  });
  // Move a one-time chore to any specific day via the date picker next to it.
  document.querySelectorAll("[data-choremove]").forEach(inp=>{
    inp.addEventListener("change", ()=>{
      const chore = state.chores.find(c=>c.id===inp.dataset.choremove); if(!chore) return;
      if(!inp.value) return;
      chore.date = inp.value;
      saveState(); renderTab();
    });
  });

  document.querySelectorAll("[data-addchorebtn]").forEach(btn=> btn.onclick=()=>{
    const pid=btn.dataset.addchorebtn;
    const input=document.querySelector(`[data-newchore="${pid}"]`);
    const dateInput=document.querySelector(`[data-newchoredate="${pid}"]`);
    const name=input.value.trim(); if(!name) return;
    const chosenDate = (dateInput && dateInput.value) || isoDate(new Date());
    state.chores.push({id:"c_"+Date.now(), name, profileId:pid, frequency:"daily", recurring:true, date:chosenDate});
    saveState(); renderTab();
    const freshInput=document.querySelector(`[data-newchore="${pid}"]`);
    if(freshInput) freshInput.focus();
  });
  document.querySelectorAll("[data-redeem]").forEach(btn=> btn.onclick=()=>{
    const [pid,rid]=btn.dataset.redeem.split("|");
    const reward=state.rewards.find(r=>r.id===rid); if(!reward) return;
    if(starBalanceOf(pid) < reward.cost) return;
    state.starBalance[pid] = starBalanceOf(pid) - reward.cost;
    state.redemptions.push({id:"rd_"+Date.now(), profileId:pid, rewardName:reward.name, cost:reward.cost, date:new Date().toISOString()});
    saveState(); renderTab();
  });

  // ---- Routines ----
  document.querySelectorAll("[data-routinestep]").forEach(el=> el.onclick=()=>{
    const [rid,sid]=el.dataset.routinestep.split("|");
    const routine = state.routines.find(r=>r.id===rid); if(!routine) return;
    const todayISO=isoDate(new Date());
    const key=rid+"_"+sid+"_"+todayISO;
    const wasCompleteBefore = routineProgress(routine, todayISO).total>0 && routineProgress(routine, todayISO).done===routineProgress(routine, todayISO).total;
    state.routineLog[key] = !state.routineLog[key];
    const nowProgress = routineProgress(routine, todayISO);
    const isCompleteNow = nowProgress.total>0 && nowProgress.done===nowProgress.total;
    const bonusKey = rid+"_bonus_"+todayISO;
    if(isCompleteNow && !wasCompleteBefore && !state.routineLog[bonusKey]){
      state.starBalance[routine.profileId] = starBalanceOf(routine.profileId) + 1;
      state.routineLog[bonusKey] = true;
    } else if(!isCompleteNow && state.routineLog[bonusKey]){
      state.starBalance[routine.profileId] = Math.max(0, starBalanceOf(routine.profileId) - 1);
      state.routineLog[bonusKey] = false;
    }
    saveState(); renderTab();
  });
  document.querySelectorAll("[data-delroutine]").forEach(btn=> btn.onclick=()=>{
    state.routines = state.routines.filter(r=>r.id!==btn.dataset.delroutine);
    saveState(); renderTab();
  });
  document.querySelectorAll("[data-addroutinebtn]").forEach(btn=> btn.onclick=()=>{
    const pid=btn.dataset.addroutinebtn;
    const nameInput=document.querySelector(`[data-newroutinename="${pid}"]`);
    const stepsInput=document.querySelector(`[data-newroutinesteps="${pid}"]`);
    const name=nameInput.value.trim(); if(!name) return;
    const steps=stepsInput.value.split("\n").map(s=>s.trim()).filter(Boolean)
      .map((text,i)=>({id:"s_"+Date.now()+"_"+i, text}));
    if(!steps.length) return;
    state.routines.push({id:"rt_"+Date.now(), name, profileId:pid, steps});
    saveState(); renderTab();
  });
}

/* =========================================================================
   MEALIE MEAL IMPORT (one-way)
   Pulls this week's meal plan from a self-hosted Mealie (mealie.io)
   instance — a free, open-source meal planner with a real REST API — into
   state.meals. This never writes back to Mealie.

   I confirmed the endpoint path (/api/households/mealplans), the bearer
   token auth, and the general paginated response shape against Mealie's
   own published docs. I could NOT test this against a live Mealie server
   from here, so I can't guarantee every field name below matches your
   instance's exact response — if a sync succeeds but meals come through
   blank/wrong, open <your-mealie-url>/docs on your own server, find the
   mealplans endpoint, and tell me what the real field names are so I can
   adjust the mapping below.

   CORS: your browser will only let this page talk to your Mealie server
   directly if Mealie's reverse proxy allows this site's origin. If that's
   not set up, this will fail with a generic network error — the "Allow
   proxy fallback" setting routes the request through the same public CORS
   proxy already used for calendar sync instead (see the warning in
   Settings about what that means for your API token).
   ========================================================================= */
async function syncMealsFromMealie(){
  const s = state.settings;
  const statusEl = document.getElementById("mealieStatus");
  const setStatus = (html)=>{ if(statusEl) statusEl.innerHTML = html; };

  const base = (s.mealieUrl||"").trim().replace(/\/+$/,"");
  const token = (s.mealieToken||"").trim();
  if(!base || !token){
    s.mealieLastError = "Enter both your Mealie server URL and API token first.";
    s.mealieLastSync = "";
    saveState();
    setStatus(`<span style="color:#c0392b">${escapeHtml(s.mealieLastError)}</span>`);
    return;
  }

  const startISO = isoDate(mealWeekStart), endISO = isoDate(addDays(mealWeekStart,6));
  const filter = `date >= "${startISO}" AND date <= "${endISO}"`;
  const directUrl = `${base}/api/households/mealplans?perPage=-1&orderBy=date&orderDirection=asc&queryFilter=${encodeURIComponent(filter)}`;
  const fetchUrl = s.mealieUseProxy ? s.proxyTemplate.replace("{url}", encodeURIComponent(directUrl)) : directUrl;

  setStatus("Syncing…");
  try{
    const res = await fetch(fetchUrl, { headers: { "Authorization": "Bearer " + token, "Accept": "application/json" } });
    if(!res.ok) throw new Error("Mealie returned HTTP " + res.status);
    const payload = await res.json();
    const entries = Array.isArray(payload) ? payload : (payload.data || payload.items || []);

    // Group this sync's entries by date/slot first, so re-syncing replaces
    // what Mealie says for those days rather than piling up duplicates.
    const fresh = {};
    let count = 0;
    for(const entry of entries){
      const date = entry.date || entry.mealDate || entry.day;
      if(!date) continue;
      const entryType = String(entry.entryType || entry.entry_type || "dinner").toLowerCase();
      const text = entry.title || entry.text
        || (entry.recipe && (entry.recipe.name || entry.recipe.slug))
        || "Planned meal";
      const bucket = ["breakfast","lunch","dinner"].includes(entryType) ? entryType : "dinner";
      const label = entryType==="side" ? `(side: ${text})` : text;
      if(!fresh[date]) fresh[date] = {};
      fresh[date][bucket] = fresh[date][bucket] ? fresh[date][bucket] + "; " + label : label;
      count++;
    }
    for(const date in fresh){
      if(!state.meals[date]) state.meals[date] = {breakfast:"",lunch:"",dinner:""};
      Object.assign(state.meals[date], fresh[date]);
    }

    s.mealieLastSync = new Date().toISOString();
    s.mealieLastError = "";
    saveState();
    // Update the status line in place (rather than a full renderTab()) so
    // the transient "Synced N meals" message isn't immediately clobbered
    // by re-rendering the settings card from state. The Meals tab reads
    // state.meals fresh whenever the user actually navigates there.
    setStatus(count ? `Synced ${count} meal${count===1?'':'s'} just now.` : "Synced, but Mealie had nothing planned for this week.");
  }catch(e){
    const corsHint = s.mealieUseProxy ? "" :
      ` This is almost always a CORS restriction from your Mealie server — either allow this site's address in Mealie's reverse proxy, or turn on "Allow proxy fallback" above and try again.`;
    s.mealieLastError = "Sync failed: " + (e&&e.message?e.message:String(e)) + corsHint;
    s.mealieLastSync = "";
    saveState();
    setStatus(`<span style="color:#c0392b">${escapeHtml(s.mealieLastError)}</span>`);
  }
}

function attachSettingsEvents(){

    try{
      await navigator.clipboard.writeText(householdCode);
      copyCodeBtn.textContent="✓ Copied!";
      setTimeout(()=>{ copyCodeBtn.textContent="📋 Copy"; }, 1500);
    }catch(e){ /* clipboard API may be unavailable; the code is still visible/selectable */ }
  };
  const signOutBtn=document.getElementById("signOutBtn");
  if(signOutBtn) signOutBtn.onclick=()=>{
    if(window.__firebase) window.__firebase.signOut(window.__firebase.auth);
  };

  document.querySelectorAll("[data-profname]").forEach(inp=> inp.addEventListener("change",()=>{
    profileById(inp.dataset.profname).name = inp.value; saveState(); renderGreeting();
  }));
  document.querySelectorAll("[data-delprof]").forEach(btn=> btn.onclick=()=>{
    state.profiles = state.profiles.filter(p=>p.id!==btn.dataset.delprof); saveState(); renderGreeting(); renderTab();
  });
  const addProfBtn=document.getElementById("addProfBtn");
  if(addProfBtn) addProfBtn.onclick=()=>{

    saveState(); renderGreeting(); renderTab();
  };

  document.querySelectorAll("[data-feedlabel]").forEach(inp=> inp.addEventListener("change",()=>{
    state.feeds.find(f=>f.id===inp.dataset.feedlabel).label=inp.value; saveState();
  }));
  document.querySelectorAll("[data-feedurl]").forEach(inp=> inp.addEventListener("change",()=>{
    state.feeds.find(f=>f.id===inp.dataset.feedurl).url=inp.value; saveState();
  }));
  document.querySelectorAll("[data-feedprof]").forEach(sel=> sel.addEventListener("change",()=>{
    state.feeds.find(f=>f.id===sel.dataset.feedprof).profileId=sel.value; saveState();
  }));
  document.querySelectorAll("[data-delfeed]").forEach(btn=> btn.onclick=()=>{
    const fid=btn.dataset.delfeed;
    state.feeds=state.feeds.filter(f=>f.id!==fid);
    state.events=state.events.filter(e=>e.feedId!==fid);
    saveState(); renderTab();
  });
  const addFeedBtn=document.getElementById("addFeedBtn");
  if(addFeedBtn) addFeedBtn.onclick=()=>{
    const label=document.getElementById("newFeedLabel").value.trim()||"Calendar";
    const url=document.getElementById("newFeedUrl").value.trim(); if(!url) return;
    state.feeds.push({id:"f_"+Date.now(), label, url, profileId:state.profiles[0]?.id||""});
    saveState(); renderTab(); syncAllFeeds(true);
  };
  const syncNowBtn=document.getElementById("syncNowBtn");
  if(syncNowBtn) syncNowBtn.onclick=()=> syncAllFeeds(true);
  const proxyTemplate=document.getElementById("proxyTemplate");
  if(proxyTemplate) proxyTemplate.addEventListener("change",()=>{
    state.settings.proxyTemplate = proxyTemplate.value; saveState();
  });

  const mealieUrl=document.getElementById("mealieUrl");
  if(mealieUrl) mealieUrl.addEventListener("change",()=>{ state.settings.mealieUrl=mealieUrl.value.trim(); saveState(); });
  const mealieToken=document.getElementById("mealieToken");
  if(mealieToken) mealieToken.addEventListener("change",()=>{ state.settings.mealieToken=mealieToken.value.trim(); saveState(); });
  const mealieUseProxy=document.getElementById("mealieUseProxy");
  if(mealieUseProxy) mealieUseProxy.addEventListener("change",()=>{ state.settings.mealieUseProxy=mealieUseProxy.checked; saveState(); });
  const mealieSyncBtn=document.getElementById("mealieSyncBtn");
  if(mealieSyncBtn) mealieSyncBtn.onclick=()=> syncMealsFromMealie();

  const setCityBtn=document.getElementById("setCityBtn");
  if(setCityBtn) setCityBtn.onclick=async ()=>{
    const name=document.getElementById("cityInput").value.trim(); if(!name) return;
    try{
      const g = await geocodeCity(name);
      state.settings.lat=g.lat; state.settings.lon=g.lon; state.settings.cityName=g.label;
      saveState(); renderTab(); refreshWeather();
    }catch(e){ alert("Couldn't find that city. Try a nearby larger city name."); }
  };

  const useMyLocationBtn=document.getElementById("useMyLocationBtn");
  if(useMyLocationBtn) useMyLocationBtn.onclick=()=>{
    const statusEl=document.getElementById("locationStatus");
    if(!("geolocation" in navigator)){
      if(statusEl) statusEl.textContent="This browser doesn't support auto-detecting location — type a city instead.";
      return;
    }
    if(statusEl) statusEl.textContent="Finding your location…";
    navigator.geolocation.getCurrentPosition(async (pos)=>{
      const {latitude, longitude} = pos.coords;
      const label = await reverseGeocode(latitude, longitude);
      state.settings.lat=latitude; state.settings.lon=longitude; state.settings.cityName=label;
      saveState(); renderTab(); refreshWeather();
    }, (err)=>{
      // err.code: 1=denied, 2=unavailable, 3=timeout
      const msg = err.code===1
        ? "Location access was denied — you can allow it in the browser's site settings, or just type a city below."
        : "Couldn't get your location — try typing a city name instead.";
      if(statusEl) statusEl.textContent=msg;
    }, {enableHighAccuracy:false, timeout:10000, maximumAge:600000});
  };

  const saveCountdownBtn=document.getElementById("saveCountdownBtn");
  if(saveCountdownBtn) saveCountdownBtn.onclick=()=>{
    state.settings.countdownTitle=document.getElementById("countdownTitle").value;
    state.settings.countdownDate=document.getElementById("countdownDate").value;

  const importBtn=document.getElementById("importBtn");

      try{

        state=Object.assign(defaultState(), data);
        state.settings = Object.assign(defaultState().settings, data.settings||{});
        saveState(); renderTab(); renderGreeting(); refreshWeather();
        alert("Backup imported.");
      }catch(e){ alert("That file didn't look like a valid backup."); }
    };
    reader.readAsText(file);
  });

  // ---- Rewards catalog ----
  document.querySelectorAll("[data-rewardname]").forEach(inp=> inp.addEventListener("change",()=>{
    state.rewards.find(r=>r.id===inp.dataset.rewardname).name = inp.value; saveState();
  }));
  document.querySelectorAll("[data-rewardcost]").forEach(inp=> inp.addEventListener("change",()=>{
    const n=parseInt(inp.value,10);
    state.rewards.find(r=>r.id===inp.dataset.rewardcost).cost = isNaN(n)? 1 : Math.max(1,n);
    saveState(); renderTab();
  }));
  document.querySelectorAll("[data-delreward]").forEach(btn=> btn.onclick=()=>{
    state.rewards = state.rewards.filter(r=>r.id!==btn.dataset.delreward);
    saveState(); renderTab();
  });
  const addRewardBtn=document.getElementById("addRewardBtn");
  if(addRewardBtn) addRewardBtn.onclick=()=>{
    const name=document.getElementById("newRewardName").value.trim(); if(!name) return;
    const cost=Math.max(1, parseInt(document.getElementById("newRewardCost").value,10)||1);
    state.rewards.push({id:"r_"+Date.now(), name, cost});
    saveState(); renderTab();
  };

  // ---- Photo screensaver ----
  const ssEnabled=document.getElementById("screensaverEnabled");
  if(ssEnabled) ssEnabled.addEventListener("change",()=>{
    state.settings.screensaverEnabled = ssEnabled.checked; saveState();
  });
  const ssIdle=document.getElementById("screensaverIdle");
  if(ssIdle) ssIdle.addEventListener("change",()=>{
    const n=parseInt(ssIdle.value,10);
    state.settings.screensaverIdleMinutes = isNaN(n)? 5 : Math.max(1,n);
    saveState();
  });
  const addPhotoBtn=document.getElementById("addPhotoBtn");
  const photoInput=document.getElementById("photoInput");
  if(addPhotoBtn) addPhotoBtn.onclick=()=> photoInput.click();
  if(photoInput) photoInput.addEventListener("change",()=>{
    const files=[...photoInput.files];
    let remaining=files.length;
    if(!remaining) return;
    files.forEach(file=>{
      resizeImageFile(file, 1600, 0.72).then(dataUrl=>{
        state.photos.push({id:"ph_"+Date.now()+"_"+Math.random().toString(36).slice(2), data:dataUrl});
        saveState();
        remaining--;
        if(remaining===0) renderTab();
      }).catch(()=>{ remaining--; if(remaining===0) renderTab(); });
    });
  });
  document.querySelectorAll("[data-delphoto]").forEach(btn=> btn.onclick=()=>{
    state.photos = state.photos.filter(ph=>ph.id!==btn.dataset.delphoto);
    saveState(); renderTab();
  });
}

// Resizes/compresses an image file client-side before it goes into
// localStorage, so a handful of family photos doesn't blow past the
// browser's storage quota. Returns a JPEG data URL.
function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let {width,height}=img;
        if(width>maxDim || height>maxDim){
          if(width>height){ height=Math.round(height*maxDim/width); width=maxDim; }
          else { width=Math.round(width*maxDim/height); height=maxDim; }
        }
        const canvas=document.createElement("canvas");
        canvas.width=width; canvas.height=height;
        canvas.getContext("2d").drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror=reject;
      img.src=reader.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}
